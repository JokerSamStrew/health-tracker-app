<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/health-tracker-app/health.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Track weight, steps, sleep and calories over time and get insight into your health."
    />
    <script>
      // Apply the theme before first paint so a dark-mode user never sees a
      // light flash. Keep the localStorage key in sync with STORAGE_KEYS.theme
      // in src/lib/storage.ts; useTheme owns the state once React mounts.
      (function () {
        try {
          var saved = localStorage.getItem('health-tracker:theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (error) {
          // localStorage unavailable (private mode): stay with the default.
        }
      })();
    </script>
    <title>Health Tracker</title>
    <script type="module" crossorigin src="/health-tracker-app/assets/index-BVa0ZKYd.js"></script>
    <link rel="stylesheet" crossorigin href="/health-tracker-app/assets/index-sx5JPNuA.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
