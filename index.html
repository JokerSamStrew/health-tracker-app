<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/health.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Track weight, steps, sleep, activity and calories over time and get insight into your health."
    />
    <title id="page-title">Health Tracker</title>
    <script>
      // Apply saved appearance preferences before first paint: a dark-mode or
      // Russian-speaking user should never see a flash of the wrong setting.
      // Keep these keys in sync with STORAGE_KEYS in src/lib/storage.ts; the
      // React hooks own the state once the app mounts.
      (function () {
        try {
          var savedTheme = localStorage.getItem('health-tracker:theme');
          var dark =
            savedTheme === 'dark' ||
            (savedTheme !== 'light' &&
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

          if (localStorage.getItem('health-tracker:locale') === 'ru') {
            document.documentElement.lang = 'ru';
            document.getElementById('page-title').textContent = 'Дневник здоровья';
            document.querySelector('meta[name="description"]').content =
              'Отслеживайте вес, шаги, сон, активность и калории, чтобы увидеть закономерности и рекомендации.';
          }
        } catch (error) {
          // localStorage unavailable (private mode): stay with the defaults.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
